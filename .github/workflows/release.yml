name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1). Required when running manually.'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download static ffmpeg
        shell: pwsh
        run: |
          $ffmpegUrl = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $env:RUNNER_TEMP -Force
          $binDir = (Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter 'ffmpeg-*' | Select-Object -First 1).FullName + '\bin'
          Write-Output "ffmpeg bin dir: $binDir"
          "FFMPEG_PATH=$binDir\ffmpeg.exe"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "FFPROBE_PATH=$binDir\ffprobe.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Prepare Tauri runtime
        run: npm run prepare:tauri-runtime

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: '轻剪 ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 轻剪 ${{ github.event.inputs.tag || github.ref_name }}

            Windows 安装包：`轻剪_X.Y.Z_x64-setup.exe` — 双击安装
          releaseDraft: true
          prerelease: false
          args: '--bundles nsis'

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
